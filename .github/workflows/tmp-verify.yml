name: tmp-verify
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[bulk_writer]" pytest
      - run: pytest tests/unit/test_bulk_writer_buffer.py -q